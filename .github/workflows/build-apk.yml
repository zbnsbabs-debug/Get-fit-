name: Build FitForge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract FitForge project
        run: |
          unzip -o FitForge_v2_Android_Project.zip
          ls -la
          ls -la FitForge_v2

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" > FitForge_v2/gradle.properties
          echo "android.enableJetifier=true" >> FitForge_v2/gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: FitForge_v2
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitForge-APK
          path: FitForge_v2/app/build/outputs/apk/debug/app-debug.apk
